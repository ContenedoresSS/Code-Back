          format: uuid
          description: ID del estudiante
        subjectId:
          type: integer
          description: ID de la materia
        createdAt:
          type: string
          format: date-time
          description: Fecha de inscripción
        student:
          type: object
          description: Datos del estudiante (solo para Teacher/God)
