      description: Lista paginada de estudiantes inscritos
      type: object
      properties:
        data:
          type: array
          description: Arreglo de estudiantes inscritos
          items:
            $ref: "#/components/schemas/EnrolledStudent"
        totalCount:
          type: integer
          description: Total de registros disponibles

    # ── Activity ──
    ActivityRules:
      title: ActivityRules
      description: >
        Reglas del editor y de la actividad, siempre completas. Cada regla se
        aplica en una capa distinta: `allowCopy`, `allowPaste` y
        `allowFileDownload` solo puede hacerlas cumplir el frontend;
        `allowLanguageChange` solo el backend; `allowCodeEdit` y
        `allowFileUpload` las previene el frontend y las verifica el backend al
        recibir la entrega.
      type: object
      required:
        [
          allowCopy,
          allowPaste,
          allowFileDownload,
          allowCodeEdit,
          allowFileUpload,
          allowLanguageChange,
        ]
      additionalProperties: false
      properties:
        allowCopy:
          type: boolean
          description: Permitir copiar código desde el editor
        allowPaste:
          type: boolean
          description: Permitir pegar código en el editor
        allowFileDownload:
          type: boolean
          description: Permitir descargar los archivos de código
        allowCodeEdit:
          type: boolean
          description: Permitir modificar el código inicial
        allowFileUpload:
          type: boolean
          description: Permitir agregar archivos de código
        allowLanguageChange:
          type: boolean
          description: Permitir entregar en un lenguaje distinto al de la actividad

    ActivityRulesPatch:
      title: ActivityRulesPatch
      description: >
        Subconjunto de reglas a establecer. Las omitidas toman su valor por
        defecto al crear, y conservan el valor actual al actualizar. Una clave
        fuera del catálogo devuelve 400.
      type: object
      additionalProperties: false
      properties:
        allowCopy:
          type: boolean
          default: true
        allowPaste:
          type: boolean
          default: true
        allowFileDownload:
          type: boolean
          default: true
        allowCodeEdit:
          type: boolean
          default: true
        allowFileUpload:
          type: boolean
          default: true
        allowLanguageChange:
          type: boolean
          default: false

    CreateActivityRequest:
      title: CreateActivityRequest
      description: Datos para crear una actividad de código
      type: object
      required: [subjectId, languageId, title]
      additionalProperties: false
      properties:
        subjectId:
          type: integer
          description: ID de la materia a la que pertenece
        languageId:
          type: integer
          description: ID del lenguaje de programación
        title:
          type: string
          maxLength: 200
          description: Título de la actividad
          example: Suma de dos números
        description:
          type: [string, "null"]
          description: Descripción detallada de la actividad
          example: Escribe un programa que lea dos enteros y devuelva su suma.
        starterCode:
          type: array
          items:
            $ref: "#/components/schemas/CodeFile"
          description: Archivos de código inicial para el estudiante
        maxAttempts:
          type: integer
          default: 0
          description: Límite de envíos (0 = ilimitado)
        rules:
          $ref: "#/components/schemas/ActivityRulesPatch"

    UpdateActivityRequest:
      title: UpdateActivityRequest
      description: Datos para actualizar una actividad
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción detallada
        languageId:
          type: integer
          description: ID del lenguaje de programación
        starterCode:
          type: array
          items:
            $ref: "#/components/schemas/CodeFile"
          description: Archivos de código inicial
        maxAttempts:
          type: integer
          description: Límite de envíos
        rules:
          $ref: "#/components/schemas/ActivityRulesPatch"

    Activity:
      title: Activity
      description: Actividad de programación completa
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único de la actividad
        professorId:
          type: string
          format: uuid
          description: ID del profesor creador
        languageId:
          type: integer
          description: ID del lenguaje de programación
        subjectId:
          type: integer
          description: ID de la materia
        title:
          type: string
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción detallada
        starterCode:
          type: [array, "null"]
          description: Archivos de código inicial
          items:
            $ref: "#/components/schemas/CodeFile"
        maxAttempts:
          type: integer
          description: Límite de envíos (0 = ilimitado)
        rules:
          $ref: "#/components/schemas/ActivityRules"
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación

    ActivitySummary:
      title: ActivitySummary
      description: Resumen de actividad para listados
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único de la actividad
        professorId:
          type: string
          format: uuid
          description: ID del profesor creador
        languageId:
          type: integer
          description: ID del lenguaje de programación
        subjectId:
          type: integer
          description: ID de la materia
        title:
          type: string
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción resumida
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación

    PaginatedActivitySummaries:
      title: PaginatedActivitySummaries
      description: Lista paginada de resúmenes de actividades
      type: object
      properties:
        data:
          type: array
          description: Arreglo de resúmenes de actividades
          items:
            $ref: "#/components/schemas/ActivitySummary"
        totalCount:
          type: integer
          description: Total de registros disponibles

    # ── Grades ──
    StudentSubmission:
      title: StudentSubmission
      description: Envío de un estudiante dentro del historial de calificaciones
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único del envío
        finalGrade:
          type: [number, "null"]
          description: Calificación del envío (0-100)
        passedTests:
          type: integer
          description: Casos de prueba aprobados
        totalTests:
          type: integer
          description: Total de casos de prueba
        executionTimeMs:
          type: [integer, "null"]
          description: Tiempo de ejecución en milisegundos
        status:
          type: string
          description: Estado del envío
        submittedAt:
          type: string
          format: date-time
          description: Fecha del envío

    StudentGrade:
      title: StudentGrade
      description: Calificación agrupada de un estudiante para una actividad
      type: object
      properties:
        student:
          type: object
          description: Datos del estudiante
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            lastName:
              type: string
            email:
              type: string
            identifier:
              type: [string, "null"]
              description: Matrícula (identificador único)
        finalGrade:
          type: [number, "null"]
          description: Calificación final = máxima entre todos sus envíos
        submissions:
          type: array
          description: Historial de envíos del estudiante (más reciente primero)
          items:
            $ref: "#/components/schemas/StudentSubmission"

    PaginatedStudentGrades:
      title: PaginatedStudentGrades
      description: Lista paginada de calificaciones agrupadas por estudiante
      type: object
      properties:
        data:
          type: array
          description: Arreglo de calificaciones por estudiante
          items:
            $ref: "#/components/schemas/StudentGrade"
        totalCount:
          type: integer
          description: Total de estudiantes con envíos disponibles

    SubmissionDetail:
      title: SubmissionDetail
      description: Detalle completo de un envío (código, salida del compilador y resultados)
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único del envío
        studentId:
          type: string
          format: uuid
          description: ID del estudiante autor del envío
        activityId:
          type: string
          format: uuid
          description: ID de la actividad a la que pertenece el envío
        languageId:
          type: integer
          description: ID del lenguaje de programación usado
        codeSnapshot:
          type: array
          description: Instantánea del código enviado (contenido en Base64)
          items:
            $ref: "#/components/schemas/CodeFile"
        finalGrade:
          type: [number, "null"]
          description: Calificación del envío (0-100)
        passedTests:
          type: integer
          description: Casos de prueba aprobados
        totalTests:
          type: integer
          description: Total de casos de prueba
        executionTimeMs:
          type: [integer, "null"]
          description: Tiempo de ejecución en milisegundos
        status:
          type: string
          description: Estado del envío
        compilerOutput:
          type: [string, "null"]
          description: >
            Salida del compilador/error de ejecución. Solo tiene valor cuando el
            envío terminó en COMPILE_ERROR o RUNTIME_ERROR
        submittedAt:
          type: string
          format: date-time
          description: Fecha del envío

    # ── Test Case ──
    CreateTestCaseRequest:
      title: CreateTestCaseRequest
      description: Datos para crear un caso de prueba
      type: object
      required: [expectedOutput]
      properties:
        input:
          type: [string, "null"]
          description: Entrada codificada en Base64 (opcional)
        expectedOutput:
          type: string
          description: Salida esperada codificada en Base64
        isHidden:
          type: boolean
          default: false
          description: Si es true, el estudiante no ve input ni output esperado

    UpdateTestCaseRequest:
      title: UpdateTestCaseRequest
      description: Datos para actualizar un caso de prueba
      type: object
      properties:
        input:
          type: [string, "null"]
          description: Entrada codificada en Base64
        expectedOutput:
          type: string
          description: Salida esperada codificada en Base64
        isHidden:
          type: boolean
          description: Visibilidad del caso de prueba

    TestCase:
      title: TestCase
      description: Caso de prueba para evaluar soluciones
      type: object
      properties:
        id:
          type: integer
          description: ID único del caso de prueba
        activityId:
          type: string
          format: uuid
          description: ID de la actividad asociada
        input:
          type: [string, "null"]
          description: Entrada codificada en Base64
        expectedOutput:
          type: string
          description: Salida esperada codificada en Base64
        isHidden:
          type: boolean
          description: Si es true, el estudiante no ve este caso

    # ── Student Workspace ──
    StudentWorkspace:
      title: StudentWorkspace
      description: Workspace del estudiante con datos públicos de la actividad
      type: object
      properties:
        activityId:
          type: string
          format: uuid
          description: ID de la actividad
        title:
          type: string
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción de la actividad
        language:
          type: object
          description: Lenguaje de programación
          properties:
            id:
              type: integer
              description: ID del lenguaje
            name:
              type: string
              description: Nombre del lenguaje
            fileExtension:
              type: string
              description: Extensión de archivo
        starterCode:
          type: [array, "null"]
          description: Archivos de código inicial
          items:
            $ref: "#/components/schemas/CodeFile"
        rules:
          $ref: "#/components/schemas/ActivityRules"
        maxAttempts:
          type: integer
          description: Límite de envíos (0 = ilimitado)
        testCases:
          type: array
          description: Casos de prueba públicos
          items:
            $ref: "#/components/schemas/PublicTestCase"

    PublicTestCase:
      title: PublicTestCase
      description: Caso de prueba visible para el estudiante
      type: object
      properties:
        id:
          type: integer
          description: ID del caso de prueba
        isHidden:
          type: boolean
          description: Si es true, no muestra input ni output
        input:
          type: [string, "null"]
          description: Entrada (solo si isHidden es false)
        expectedOutput:
          type: string
          description: Salida esperada (solo si isHidden es false)

  responses:
    BadRequest:
      description: Parámetros inválidos o faltantes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token inválido, expirado o ausente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Rol sin permisos para esta acción
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit excedido (2 peticiones / 5 min)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Has excedido el límite de ejecuciones. Por favor, espera cinco antes de volver a intentarlo."
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
