openapi: 3.1.0
info:
  title: Code Panel API
  version: 1.0.0
  description: |
    API REST del sistema de ejecución remota de código y calificación automática
    para la **UADY** (Yucatán, México). Se integra con **Moodle** vía iframe.

    ### Roles
    - **God** — administrador de plataforma. Esquiva todas las verificaciones RBAC.
    - **Teacher** — crea materias, actividades y casos de prueba; revisa entregas.
    - **Student** — se matricula, escribe y ejecuta código, envía soluciones.

    ### Rate limiting
    Los endpoints `/execution/*` y `/activity/:id/submit` están limitados a
    **2 peticiones cada 5 minutos por IP**.

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://code.oryondev.duckdns.org/api/v1
    description: Producción

tags:
  - name: Auth
    description: Registro, login, refresh de tokens y recuperación de contraseña
  - name: Execution
    description: Ejecución de código en sandbox Docker
  - name: Invitation
    description: Códigos de invitación (God only)
  - name: Programming Language
    description: Lenguajes de programación (God only)
  - name: User
    description: Perfil del usuario autenticado
  - name: Subject
    description: Materias (Teacher)
  - name: Activity
    description: Actividades de código (Teacher)
  - name: Test Case
    description: Casos de prueba por actividad (Teacher)
  - name: Submission
    description: Envío y evaluación de soluciones
  - name: Enrollment
    description: Inscripciones de estudiantes a materias
  - name: Health
    description: Health check endpoint para monitoreo

security:
  - bearerAuth: []

paths:
  # ══════════════════════════════════════════════
  #  Health Check
  # ══════════════════════════════════════════════
  /api/health:
    servers:
      - url: http://localhost:3000
        description: Desarrollo local
      - url: https://code.oryondev.duckdns.org
        description: Producción
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check endpoint
      description: |
        Smoke test para verificar que la API está funcionando.
        Se sirve en la raíz (`/api/health`), fuera del prefijo `/api/v1`.
        **Rate‑limited**: 10 peticiones por minuto por IP.
      security: []
      responses:
        "200":
          description: API está funcionando
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ══════════════════════════════════════════════
  #  Auth
  # ══════════════════════════════════════════════
  /auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Registrar usuario
      description: |
        Registro libre para estudiantes (sin invitationCode).
        Los profesores requieren un código de invitación válido de un solo uso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email o identificador ya en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Iniciar sesión
      description: Devuelve token pair (access 4h + refresh 7d).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: La cuenta está desactivada o suspendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refrescar access token
      description: Usa el refresh token para obtener un nuevo token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Nuevo token pair generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: La cuenta está desactivada o suspendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [Auth]
      summary: Solicitar código de recuperación de contraseña
      description: |
        Genera un código numérico de 6 dígitos y lo envía por correo al usuario.
        La respuesta es la misma exista o no el email (anti‑enumeración).
        Requiere un proveedor de correo configurado (`EMAIL_PROVIDER`); de lo
        contrario responde **500**.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Código enviado (si el email existe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/verify-reset-code:
    post:
      operationId: authVerifyResetCode
      tags: [Auth]
      summary: Validar código de recuperación
      description: |
        Verifica el código recibido por correo y su vigencia. Si es válido,
        emite un token JWT de restablecimiento con validez de 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResetCodeRequest"
      responses:
        "200":
          description: Código válido, se emite el token de restablecimiento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResetCodeResponse"
        "400":
          description: Código inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [Auth]
      summary: Establecer nueva contraseña
      description: |
        Usa el token emitido en `/auth/verify-reset-code` para fijar una nueva
        contraseña y limpiar el código de recuperación almacenado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ══════════════════════════════════════════════
  #  Execution
  # ══════════════════════════════════════════════
  /execution/run:
    post:
      operationId: executionRun
      tags: [Execution]
      summary: Ejecutar código (un solo archivo)
      description: |
        Ejecuta un fragmento de código en un contenedor Docker efímero con sandboxing.
        **Rate‑limited**: 2 peticiones cada 5 minutos por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [languageId, code]
              properties:
                languageId:
                  type: integer
                  description: ID del lenguaje de programación
                  example: 1
                code:
                  type: string
                  description: Código fuente codificado en Base64
                  example: I2luY2x1ZGUgPGlvc3RyZWFtPgppbnQgbWFpbigpIHsgcmV0dXJuIDA7IH0=
                stdin:
                  type: string
                  description: Entrada estándar codificada en Base64 (opcional)
                  example: NQo3
      responses:
        "200":
          description: Resultado de la ejecución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /execution/run-with-files:
    post:
      operationId: executionRunWithFiles
      tags: [Execution]
      summary: Ejecutar código con múltiples archivos
      description: |
        Ejecuta múltiples archivos de código en un contenedor Docker efímero.
        **Rate‑limited**: 2 peticiones cada 5 minutos por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCodeWithFilesRequest"
      responses:
        "200":
          description: Resultado de la ejecución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════
  #  Invitation
  # ══════════════════════════════════════════════
  /invitation:
    post:
      operationId: invitationCreate
      tags: [Invitation]
      summary: Crear código de invitación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
                  description: ID del rol asociado al código
                  example: 2
      responses:
        "201":
          description: Código creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: invitationList
      tags: [Invitation]
      summary: Listar códigos de invitación
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de códigos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvitations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invitation/{id}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    put:
      operationId: invitationUpdate
      tags: [Invitation]
      summary: Actualizar código de invitación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isUsed:
                  type: boolean
                roleId:
                  type: integer
      responses:
        "200":
          description: Código actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: invitationDelete
      tags: [Invitation]
      summary: Eliminar código de invitación
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Código eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Programming Language
  # ══════════════════════════════════════════════
  /programming-language:
    post:
      operationId: programmingLanguageCreate
      tags: [Programming Language]
      summary: Crear lenguaje de programación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLanguageRequest"
      responses:
        "201":
          description: Lenguaje creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: programmingLanguageList
      tags: [Programming Language]
      summary: Listar lenguajes de programación
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de lenguajes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /programming-language/{id}:
    parameters:
      - $ref: "#/components/parameters/LanguageId"
    get:
      operationId: programmingLanguageGetById
      tags: [Programming Language]
      summary: Obtener lenguaje por ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lenguaje encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: programmingLanguageUpdate
      tags: [Programming Language]
      summary: Actualizar lenguaje
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLanguageRequest"
      responses:
        "200":
          description: Lenguaje actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: programmingLanguageDelete
      tags: [Programming Language]
      summary: Eliminar lenguaje
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lenguaje eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Language deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  User
  # ══════════════════════════════════════════════
  /user/me:
    get:
      operationId: userGetProfile
      tags: [User]
      summary: Obtener perfil del usuario autenticado
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: userUpdateProfile
      tags: [User]
      summary: Actualizar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Identificador ya en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user/change-password:
    post:
      operationId: userChangePassword
      tags: [User]
      summary: Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user:
    get:
      operationId: userList
      tags: [User]
      summary: Listar usuarios (solo administrador)
      description: |
        Devuelve la lista paginada de usuarios.

        - Solo el rol **God** (administrador) puede acceder.
        - Filtros opcionales por `role` (Student, Teacher, God) y `search`
          (nombre o apellido).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: role
          in: query
          schema:
            type: string
            enum: [Student, Teacher, God]
          description: Filtrar por nombre del rol
        - name: search
          in: query
          schema:
            type: string
          description: Buscar por nombre o apellido (case‑insensitive)
      responses:
        "200":
          description: Lista paginada de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /user/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: userAdminUpdate
      tags: [User]
      summary: Gestionar un usuario (solo administrador)
      description: |
        Permite al administrador (rol **God**) cambiar la contraseña, activar o
        desactivar la cuenta, o cambiar el rol de un usuario.

        - No se puede desactivar ni degradar al **último administrador activo**
          (responde `409`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListItem"
        "400":
          description: Body vacío o rol inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Se intentó desactivar o degradar al último administrador activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ══════════════════════════════════════════════
  #  Subject
  # ══════════════════════════════════════════════
  /subject:
    post:
      operationId: subjectCreate
      tags: [Subject]
      summary: Crear materia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
      responses:
        "201":
          description: Materia creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: subjectList
      tags: [Subject]
      summary: Listar materias
      description: |
        Teachers ven solo sus materias. God ve todas.
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: search
          in: query
          schema:
            type: string
          description: Filtrar por nombre (búsqueda parcial, case‑insensitive)
      responses:
        "200":
          description: Lista paginada de materias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSubjects"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /subject/{id}:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      operationId: subjectGetById
      tags: [Subject]
      summary: Obtener materia
      responses:
        "200":
          description: Materia encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: subjectUpdate
      tags: [Subject]
      summary: Actualizar materia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
      responses:
        "200":
          description: Materia actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: subjectDelete
      tags: [Subject]
      summary: Eliminar materia
      responses:
        "204":
          description: Materia eliminada
        "404":
          $ref: "#/components/responses/NotFound"

  /subject/{id}/students:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      operationId: subjectGetStudents
      tags: [Subject]
      summary: Listar alumnos inscritos en una materia
      description: |
        Devuelve la lista paginada de estudiantes inscritos en la materia.
        Solo el profesor propietario de la materia (o God) puede acceder.
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: search
          in: query
          schema:
            type: string
          description: Filtrar por nombre, apellido o email (case‑insensitive)
      responses:
        "200":
          description: Lista paginada de alumnos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEnrolledStudents"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /subject/{id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    post:
      operationId: subjectDuplicate
      tags: [Subject]
      summary: Duplicar una materia
      description: |
        Clona una materia junto con sus actividades y casos de prueba
        (para un nuevo periodo escolar). No clona inscripciones ni envíos.
        Solo el profesor propietario de la materia (o God) puede duplicarla.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateSubjectRequest"
      responses:
        "201":
          description: Materia duplicada con conteo de clonados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateSubjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Enrollment
  # ══════════════════════════════════════════════
  /enrollment:
    post:
      operationId: enrollmentCreate
      tags: [Enrollment]
      summary: Inscribirse a una materia
      description: |
        Permite a un estudiante inscribirse en una materia.
        Solo estudiantes (y God) pueden usar este endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
      responses:
        "201":
          description: Inscripción creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: El estudiante ya está inscrito en esta materia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: enrollmentList
      tags: [Enrollment]
      summary: Listar inscripciones
      description: |
        - **Student**: ve sus propias inscripciones.
        - **Teacher**: ve los alumnos inscritos en sus materias.
        - **God**: ve todas las inscripciones.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: search
          in: query
          schema:
            type: string
          description: |
            Student: filtra por nombre de materia.
            Teacher/God: filtra por nombre, apellido o email del estudiante.
      responses:
        "200":
          description: Lista paginada de inscripciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEnrollments"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /enrollment/{id}:
    parameters:
      - $ref: "#/components/parameters/EnrollmentId"
    delete:
      operationId: enrollmentDelete
      tags: [Enrollment]
      summary: Desinscribir de una materia
      description: |
        - **Student**: solo puede eliminarse a sí mismo.
        - **Teacher**: puede remover alumnos de sus propias materias.
        - **God**: puede eliminar cualquier inscripción.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Inscripción eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Activity
  # ══════════════════════════════════════════════
  /activity:
    post:
      operationId: activityCreate
      tags: [Activity]
      summary: Crear actividad de código
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
      responses:
        "201":
          description: Actividad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Curso o lenguaje no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: activityList
      tags: [Activity]
      summary: Listar actividades
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: subjectId
          in: query
          schema:
            type: integer
          description: Filtrar por materia
      responses:
        "200":
          description: Lista paginada de actividades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedActivitySummaries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /activity/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: activityGetById
      tags: [Activity]
      summary: Obtener actividad
      responses:
        "200":
          description: Actividad encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: activityUpdate
      tags: [Activity]
      summary: Actualizar actividad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
      responses:
        "200":
          description: Actividad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: activityDelete
      tags: [Activity]
      summary: Eliminar actividad
      responses:
        "204":
          description: Actividad eliminada
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Activity Workspace
  # ══════════════════════════════════════════════
  /activity/{id}/workspace:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: activityGetWorkspace
      tags: [Activity]
      summary: Obtener workspace del estudiante
      description: |
        Público. Devuelve título, descripción, lenguaje, código inicial,
        flags de copy/paste, intentos máximos y **solo casos de prueba públicos**.
        Los casos ocultos aparecen sin input ni expectedOutput.
      security: []
      responses:
        "200":
          description: Workspace del estudiante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentWorkspace"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Activity Submission
  # ══════════════════════════════════════════════
  /activity/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      operationId: activitySubmit
      tags: [Submission]
      summary: Enviar solución para evaluación
      description: |
        Evalúa automáticamente el código contra todos los casos de prueba
        de la actividad.

        - Auth opcional: usuarios no autenticados pueden ejecutar pero sus
          envíos no se persisten en BD ni se les aplica límite de intentos.
        - **Rate‑limited**: 2 peticiones cada 5 minutos por IP.
        - Se verifican las reglas de la actividad (`rules`) que le corresponden
          al backend. Si `allowCodeEdit` es `false`, el código enviado debe ser
          idéntico al `starterCode`; si `allowFileUpload` es `false`, no se
          puede agregar ni quitar archivos. Ambas devuelven `403`. Una actividad
          sin `starterCode` no tiene referencia contra la que comparar, así que
          esas dos reglas no se aplican.
      security: [] # optional auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/CodeFile"
                  description: Archivos de código en Base64
                languageId:
                  type: integer
                  minimum: 1
                  description: >
                    Lenguaje con el que evaluar la entrega. Solo se toma en
                    cuenta si la actividad tiene `allowLanguageChange: true`;
                    en caso contrario se ignora y se usa el lenguaje de la
                    actividad. Si se envía y no existe, devuelve `404`.
      responses:
        "200":
          description: Resultado de la evaluación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: >
            Límite máximo de intentos alcanzado, o una regla de la actividad
            impide la entrega (`allowCodeEdit` o `allowFileUpload`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La actividad no existe, o el `languageId` enviado no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /activity/{id}/grades:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: activityGetGrades
      tags: [Activity]
      summary: Consultar calificaciones de una actividad (vista maestro)
      description: |
        Devuelve la lista paginada de estudiantes con envíos para la actividad,
        agrupada por estudiante.

        - Solo el profesor propietario de la materia de la actividad (o God).
        - Solo se listan estudiantes con al menos un envío.
        - `finalGrade` de cada estudiante es la **calificación más alta** entre
          todos sus envíos.
        - `submissions` es el historial completo del estudiante, ordenado del
          envío más reciente al más antiguo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: search
          in: query
          schema:
            type: string
          description: Filtrar por nombre, apellido, email o matrícula (case‑insensitive)
      responses:
        "200":
          description: Lista paginada de calificaciones agrupadas por estudiante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedStudentGrades"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El usuario no es el profesor propietario de la materia a la que
            pertenece la actividad, o su rol no está autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /activity/{id}/submissions/{submissionId}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
      - $ref: "#/components/parameters/SubmissionId"
    get:
      operationId: activityGetSubmissionDetail
      tags: [Activity]
      summary: Consultar el detalle completo de un envío (vista maestro)
      description: |
        Devuelve el detalle completo de un envío de un estudiante, incluyendo la
        instantánea del código (`codeSnapshot`, contenido en Base64) y la salida
        del compilador/errores (`compilerOutput`).

        - Solo el profesor propietario de la materia de la actividad (o God).
        - El `compilerOutput` solo tiene valor cuando el envío terminó en
          `COMPILE_ERROR` o `RUNTIME_ERROR`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Detalle completo del envío
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El usuario no es el profesor propietario de la materia a la que
            pertenece la actividad, o su rol no está autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Test Case
  # ══════════════════════════════════════════════
  /activity/{id}/test-case:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: testCaseList
      tags: [Test Case]
      summary: Listar casos de prueba
      responses:
        "200":
          description: Lista de casos de prueba
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: testCaseCreate
      tags: [Test Case]
      summary: Crear caso de prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "201":
          description: Caso de prueba creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/BadRequest"

  /activity/{id}/test-case/{testCaseId}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
      - $ref: "#/components/parameters/TestCaseId"
    put:
      operationId: testCaseUpdate
      tags: [Test Case]
      summary: Actualizar caso de prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Caso de prueba actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: testCaseDelete
      tags: [Test Case]
      summary: Eliminar caso de prueba
      responses:
        "204":
          description: Caso de prueba eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Settings
  # ══════════════════════════════════════════════
  /settings/email-domains:
    get:
      operationId: emailDomainsGet
      tags: [Settings]
      summary: Obtener dominios de correo permitidos para el registro
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de dominios permitidos (vacía = todos permitidos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomains"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: emailDomainsUpdate
      tags: [Settings]
      summary: Reemplazar la lista de dominios de correo permitidos
      description: |
        Reemplaza por completo la lista de dominios permitidos. Si se envía una
        lista vacía, se permiten todos los dominios.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmailDomainsRequest"
      responses:
        "200":
          description: Lista de dominios actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDomains"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

# ══════════════════════════════════════════════
#  Components
# ══════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT (4 horas de validez).

        Se obtiene mediante `POST /auth/login` y se refresca con `POST /auth/refresh`.

  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID de la invitación
    LanguageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID del lenguaje de programación
    SubjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID de la materia
    ActivityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID de la actividad
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID del usuario
    TestCaseId:
      name: testCaseId
      in: path
      required: true
      schema:
        type: integer
      description: ID del caso de prueba
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID del envío
    EnrollmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID de la inscripción
    Skip:
      name: skip
      in: query
      schema:
        type: integer
        default: 0
      description: Registros a saltar (paginación)
    Take:
      name: take
      in: query
      schema:
        type: integer
        default: 10
      description: Registros por página
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Número de página
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
      description: Registros por página

  schemas:
    # ── Settings ──
    EmailDomains:
      title: EmailDomains
      description: Lista de dominios de correo permitidos para el registro
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          description: Dominios permitidos (vacío = todos permitidos)
          items:
            type: string
            example: uady.mx

    UpdateEmailDomainsRequest:
      title: UpdateEmailDomainsRequest
      description: Cuerpo para reemplazar la lista de dominios permitidos
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          description: Nuevos dominios permitidos (vacío = todos permitidos)
          items:
            type: string
            example: uady.mx

    # ── Shared ──
    Error:
      title: Error
      description: Respuesta de error estándar
      type: object
      properties:
        error:
          type: string
          description: Mensaje descriptivo del error

    HealthResponse:
      title: HealthResponse
      description: Respuesta del healthcheck
      type: object
      properties:
        status:
          type: string
          description: Estado de la API
          example: ok
        timestamp:
          type: string
          format: date-time
          description: Timestamp de la respuesta
        version:
          type: string
          description: Versión de la API
          example: 1.0.0

    CodeFile:
      title: CodeFile
      description: Archivo de código fuente codificado en Base64
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          description: Nombre del archivo con extensión
          example: main.cpp
        content:
          type: string
          description: Contenido del archivo codificado en Base64
          example: I2luY2x1ZGUgPGlvc3RyZWFtPgppbnQgbWFpbigpIHsgcmV0dXJuIDA7IH0=

    # ── Auth ──
    RegisterUserRequest:
      title: RegisterUserRequest
      description: Datos para registrar un nuevo usuario
      type: object
      required: [email, password, name, lastName]
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: estudiante@uady.mx
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña (mínimo 8 caracteres)
          example: AdminPassword123!!
        name:
          type: string
          maxLength: 100
          description: Nombre del usuario
          example: Alan
        lastName:
          type: string
          maxLength: 100
          description: Apellido del usuario
          example: Turing
        invitationCode:
          type: string
          description: Código de invitación (requerido para Teacher)
          example: A1B2C3D4
        identifier:
          type: string
          description: Identificador único opcional (matrícula)
          example: "123456"

    RegisterUserResponse:
      title: RegisterUserResponse
      description: Datos del usuario registrado exitosamente
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único del usuario
        email:
          type: string
          description: Correo electrónico
        name:
          type: string
          description: Nombre del usuario
        lastName:
          type: string
          description: Apellido del usuario
        role:
          type: string
          description: Rol asignado al usuario
          example: Student

    LoginRequest:
      title: LoginRequest
      description: Credenciales para iniciar sesión
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email o identificador (matrícula)
          example: admin@admin.com
        password:
          type: string
          format: password
          description: Contraseña del usuario
          example: AdminPassword123!!

    LoginResponse:
      title: LoginResponse
      description: Tokens de autenticación JWT
      type: object
      properties:
        token:
          type: string
          description: Access token JWT (4 horas)
        refreshToken:
          type: string
          description: Refresh token JWT (7 días)

    RefreshSessionRequest:
      title: RefreshSessionRequest
      description: Solicitud para refrescar tokens
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token JWT válido

    ForgotPasswordRequest:
      title: ForgotPasswordRequest
      description: Solicitud para enviar el código de recuperación de contraseña
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email de la cuenta registrada
          example: student@example.com

    VerifyResetCodeRequest:
      title: VerifyResetCodeRequest
      description: Validación del código de recuperación recibido por correo
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          description: Email de la cuenta registrada
          example: student@example.com
        code:
          type: string
          description: Código numérico de 6 dígitos recibido por correo
          example: "483920"

    VerifyResetCodeResponse:
      title: VerifyResetCodeResponse
      description: Token de restablecimiento emitido tras validar el código
      type: object
      properties:
        resetToken:
          type: string
          description: Token JWT de restablecimiento (15 minutos de validez)

    ResetPasswordRequest:
      title: ResetPasswordRequest
      description: Solicitud para establecer una nueva contraseña
      type: object
      required: [resetToken, newPassword]
      properties:
        resetToken:
          type: string
          description: Token obtenido en POST /auth/verify-reset-code
        newPassword:
          type: string
          format: password
          description: Nueva contraseña del usuario
          example: NewPassword123!!

    MessageResponse:
      title: MessageResponse
      description: Respuesta genérica con mensaje informativo
      type: object
      properties:
        message:
          type: string
          description: Mensaje descriptivo de la operación

    # ── Execution ──
    RunCodeWithFilesRequest:
      title: RunCodeWithFilesRequest
      description: Solicitud para ejecutar código con múltiples archivos
      type: object
      required: [languageId, files, entryPoint]
      properties:
        languageId:
          type: integer
          description: ID del lenguaje de programación
          example: 1
        files:
          type: array
          description: Archivos de código a ejecutar
          items:
            $ref: "#/components/schemas/CodeFile"
        entryPoint:
          type: string
          description: Nombre del archivo principal a ejecutar
          example: main.cpp
        stdin:
          type: string
          description: Entrada estándar codificada en Base64 (opcional)
          example: NQo3

    ExecutionResult:
      title: ExecutionResult
      description: Resultado de la ejecución de código
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        stdout:
          type: string
          description: Salida estándar del programa
        stderr:
          type: string
          description: Salida de error (vacío si exitoso)
        timeMs:
          type: integer
          description: Tiempo de ejecución en milisegundos
          example: 342

    ExecutionStatus:
      title: ExecutionStatus
      description: Estado de la ejecución de código
      type: string
      enum: [SUCCESS, TIME_LIMIT_EXCEEDED, RUNTIME_ERROR, COMPILE_ERROR]

    # ── Evaluation ──
    EvaluationResult:
      title: EvaluationResult
      description: Resultado de la evaluación de una solución
      type: object
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        finalGrade:
          type: number
          description: Calificación sobre 100 (0 si hubo error)
          example: 100
        passedTests:
          type: integer
          description: Número de casos de prueba pasados
          example: 3
        totalTests:
          type: integer
          description: Número total de casos de prueba
          example: 4
        executionTimeMs:
          type: integer
          description: Tiempo total de ejecución en milisegundos
          example: 1450
        compilerOutput:
          type: [string, "null"]
          description: Mensaje de error si hubo fallo de compilación
        languageId:
          type: integer
          description: ID del lenguaje de programación

    SubmissionResult:
      title: SubmissionResult
      description: Resultado de la evaluación de un envío, con indicador de persistencia
      type: object
      required: [saved]
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        finalGrade:
          type: number
          description: Calificación sobre 100 (0 si hubo error)
          example: 100
        passedTests:
          type: integer
          description: Número de casos de prueba pasados
          example: 3
        totalTests:
          type: integer
          description: Número total de casos de prueba
          example: 4
        executionTimeMs:
          type: integer
          description: Tiempo total de ejecución en milisegundos
          example: 1450
        compilerOutput:
          type: [string, "null"]
          description: Mensaje de error si hubo fallo de compilación
        languageId:
          type: integer
          description: ID del lenguaje de programación
        saved:
          type: boolean
          description: |
            Indica si el envío se persistió en la base de datos. Es `false`
            cuando la petición no llegó con un token de acceso válido: el
            código se evalúa, pero no se guarda ningún envío.
          example: true

    SubmissionStatus:
      title: SubmissionStatus
      description: Estado de la evaluación de una solución
      type: string
      enum:
        [PENDING, ACCEPTED, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, COMPILE_ERROR, RUNTIME_ERROR]

    # ── Invitation ──
    Invitation:
      title: Invitation
      description: Código de invitación para registrar profesores
      type: object
      properties:
        id:
          type: integer
          description: ID único de la invitación
        code:
          type: string
          description: Código alfanumérico de 8 caracteres
          example: A1B2C3D4
        roleId:
          type: integer
          description: ID del rol asociado
        isUsed:
          type: boolean
          description: Indica si el código ya fue utilizado
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación
        role:
          type: object
          description: Rol asociado a la invitación
          properties:
            id:
              type: integer
            name:
              type: string

    PaginatedInvitations:
      title: PaginatedInvitations
      description: Lista paginada de códigos de invitación
      type: object
      properties:
        data:
