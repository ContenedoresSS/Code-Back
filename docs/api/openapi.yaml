          description: Arreglo de invitaciones
          items:
            $ref: "#/components/schemas/Invitation"
        totalCount:
          type: integer
          description: Total de registros disponibles

    # ── Language ──
    CreateLanguageRequest:
      title: CreateLanguageRequest
      description: Datos para crear un lenguaje de programación
      type: object
      required: [name, editorIdentifier, version, dockerImage, executionCommand, fileExtension]
      properties:
        name:
          type: string
          description: Nombre del lenguaje
          example: C++
        editorIdentifier:
          type: string
          description: Identificador para el editor de código
          example: cpp
        version:
          type: string
          description: Versión del lenguaje
          example: "13.2"
        dockerImage:
          type: string
          description: Imagen Docker para ejecutar el código
          example: gcc:13.2
        executionCommand:
          type: string
          description: Comando de ejecución (usa ${file} como placeholder)
          example: g++ -o solution *.cpp && ./solution
        fileExtension:
          type: string
          description: Extensión de archivo del lenguaje
          example: cpp

    UpdateLanguageRequest:
      title: UpdateLanguageRequest
      description: Datos para actualizar un lenguaje de programación
      type: object
      properties:
        name:
          type: string
          description: Nombre del lenguaje
        editorIdentifier:
          type: string
          description: Identificador para el editor de código
        version:
          type: string
          description: Versión del lenguaje
        dockerImage:
          type: string
          description: Imagen Docker para ejecutar el código
        executionCommand:
          type: string
          description: Comando de ejecución
        fileExtension:
          type: string
          description: Extensión de archivo del lenguaje

    Language:
      title: Language
      description: Lenguaje de programación soportado
      type: object
      properties:
        id:
