openapi: 3.1.0
info:
  title: Code Panel API
  version: 1.0.0
  description: |
    API REST del sistema de ejecución remota de código y calificación automática
    para la **UADY** (Yucatán, México). Se integra con **Moodle** vía iframe.

    ### Roles
    - **God** — administrador de plataforma. Esquiva todas las verificaciones RBAC.
    - **Teacher** — crea materias, actividades y casos de prueba; revisa entregas.
    - **Student** — se matricula, escribe y ejecuta código, envía soluciones.

    ### Rate limiting
    Los endpoints `/execution/*` y `/activity/:id/submit` están limitados a
    **2 peticiones cada 5 minutos por IP**.

servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://codepanel.orchfr.duckdns.org/api/v1
    description: Producción

tags:
  - name: Auth
    description: Registro, login y refresh de tokens
  - name: Execution
    description: Ejecución de código en sandbox Docker
  - name: Invitation
    description: Códigos de invitación (God only)
  - name: Programming Language
    description: Lenguajes de programación (God only)
  - name: User
    description: Perfil del usuario autenticado
  - name: Subject
    description: Materias (Teacher)
  - name: Activity
    description: Actividades de código (Teacher)
  - name: Test Case
    description: Casos de prueba por actividad (Teacher)
  - name: Submission
    description: Envío y evaluación de soluciones

security:
  - bearerAuth: []

paths:
  # ══════════════════════════════════════════════
  #  Auth
  # ══════════════════════════════════════════════
  /auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Registrar usuario
      description: |
        Registro libre para estudiantes (sin invitationCode).
        Los profesores requieren un código de invitación válido de un solo uso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email o identificador ya en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Iniciar sesión
      description: Devuelve token pair (access 4h + refresh 7d).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refrescar access token
      description: Usa el refresh token para obtener un nuevo token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Nuevo token pair generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ══════════════════════════════════════════════
  #  Execution
  # ══════════════════════════════════════════════
  /execution/run:
    post:
      operationId: executionRun
      tags: [Execution]
      summary: Ejecutar código (un solo archivo)
      description: |
        Ejecuta un fragmento de código en un contenedor Docker efímero con sandboxing.
        **Rate‑limited**: 2 peticiones cada 5 minutos por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [languageId, code]
              properties:
                languageId:
                  type: integer
                  description: ID del lenguaje de programación
                  example: 1
                code:
                  type: string
                  description: Código fuente codificado en Base64
                  example: I2luY2x1ZGUgPGlvc3RyZWFtPgppbnQgbWFpbigpIHsgcmV0dXJuIDA7IH0=
                stdin:
                  type: string
                  description: Entrada estándar codificada en Base64 (opcional)
                  example: NQo3
      responses:
        "200":
          description: Resultado de la ejecución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  /execution/run-with-files:
    post:
      operationId: executionRunWithFiles
      tags: [Execution]
      summary: Ejecutar código con múltiples archivos
      description: |
        Ejecuta múltiples archivos de código en un contenedor Docker efímero.
        **Rate‑limited**: 2 peticiones cada 5 minutos por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCodeWithFilesRequest"
      responses:
        "200":
          description: Resultado de la ejecución
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"

  # ══════════════════════════════════════════════
  #  Invitation
  # ══════════════════════════════════════════════
  /invitation:
    post:
      operationId: invitationCreate
      tags: [Invitation]
      summary: Crear código de invitación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: integer
                  description: ID del rol asociado al código
                  example: 2
      responses:
        "201":
          description: Código creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      operationId: invitationList
      tags: [Invitation]
      summary: Listar códigos de invitación
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de códigos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvitations"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invitation/{id}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    put:
      operationId: invitationUpdate
      tags: [Invitation]
      summary: Actualizar código de invitación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isUsed:
                  type: boolean
                roleId:
                  type: integer
      responses:
        "200":
          description: Código actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: invitationDelete
      tags: [Invitation]
      summary: Eliminar código de invitación
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Código eliminado
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Programming Language
  # ══════════════════════════════════════════════
  /programming-language:
    post:
      operationId: programmingLanguageCreate
      tags: [Programming Language]
      summary: Crear lenguaje de programación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLanguageRequest"
      responses:
        "201":
          description: Lenguaje creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: programmingLanguageList
      tags: [Programming Language]
      summary: Listar lenguajes de programación
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de lenguajes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /programming-language/{id}:
    parameters:
      - $ref: "#/components/parameters/LanguageId"
    get:
      operationId: programmingLanguageGetById
      tags: [Programming Language]
      summary: Obtener lenguaje por ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lenguaje encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: programmingLanguageUpdate
      tags: [Programming Language]
      summary: Actualizar lenguaje
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLanguageRequest"
      responses:
        "200":
          description: Lenguaje actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Language"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: programmingLanguageDelete
      tags: [Programming Language]
      summary: Eliminar lenguaje
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lenguaje eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Language deleted successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  User
  # ══════════════════════════════════════════════
  /user/me:
    get:
      operationId: userGetProfile
      tags: [User]
      summary: Obtener perfil del usuario autenticado
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: userUpdateProfile
      tags: [User]
      summary: Actualizar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Identificador ya en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user/change-password:
    post:
      operationId: userChangePassword
      tags: [User]
      summary: Cambiar contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ══════════════════════════════════════════════
  #  Subject
  # ══════════════════════════════════════════════
  /subject:
    post:
      operationId: subjectCreate
      tags: [Subject]
      summary: Crear materia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
      responses:
        "201":
          description: Materia creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: subjectList
      tags: [Subject]
      summary: Listar materias
      description: |
        Teachers ven solo sus materias. God ve todas.
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: search
          in: query
          schema:
            type: string
          description: Filtrar por nombre (búsqueda parcial, case‑insensitive)
      responses:
        "200":
          description: Lista paginada de materias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSubjects"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /subject/{id}:
    parameters:
      - $ref: "#/components/parameters/SubjectId"
    get:
      operationId: subjectGetById
      tags: [Subject]
      summary: Obtener materia
      responses:
        "200":
          description: Materia encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: subjectUpdate
      tags: [Subject]
      summary: Actualizar materia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
      responses:
        "200":
          description: Materia actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: subjectDelete
      tags: [Subject]
      summary: Eliminar materia
      responses:
        "204":
          description: Materia eliminada
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Activity
  # ══════════════════════════════════════════════
  /activity:
    post:
      operationId: activityCreate
      tags: [Activity]
      summary: Crear actividad de código
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
      responses:
        "201":
          description: Actividad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Curso o lenguaje no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: activityList
      tags: [Activity]
      summary: Listar actividades
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Take"
        - name: subjectId
          in: query
          schema:
            type: integer
          description: Filtrar por materia
      responses:
        "200":
          description: Lista paginada de actividades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedActivitySummaries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /activity/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: activityGetById
      tags: [Activity]
      summary: Obtener actividad
      responses:
        "200":
          description: Actividad encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: activityUpdate
      tags: [Activity]
      summary: Actualizar actividad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
      responses:
        "200":
          description: Actividad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: activityDelete
      tags: [Activity]
      summary: Eliminar actividad
      responses:
        "204":
          description: Actividad eliminada
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Activity Workspace
  # ══════════════════════════════════════════════
  /activity/{id}/workspace:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: activityGetWorkspace
      tags: [Activity]
      summary: Obtener workspace del estudiante
      description: |
        Público. Devuelve título, descripción, lenguaje, código inicial,
        flags de copy/paste, intentos máximos y **solo casos de prueba públicos**.
        Los casos ocultos aparecen sin input ni expectedOutput.
      security: []
      responses:
        "200":
          description: Workspace del estudiante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentWorkspace"
        "404":
          $ref: "#/components/responses/NotFound"

  # ══════════════════════════════════════════════
  #  Activity Submission
  # ══════════════════════════════════════════════
  /activity/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      operationId: activitySubmit
      tags: [Submission]
      summary: Enviar solución para evaluación
      description: |
        Evalúa automáticamente el código contra todos los casos de prueba
        de la actividad.

        - Auth opcional: usuarios no autenticados pueden ejecutar pero sus
          envíos no se persisten en BD ni se les aplica límite de intentos.
        - **Rate‑limited**: 2 peticiones cada 5 minutos por IP.
      security: [] # optional auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/CodeFile"
                  description: Archivos de código en Base64
      responses:
        "200":
          description: Resultado de la evaluación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Límite máximo de intentos alcanzado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ══════════════════════════════════════════════
  #  Test Case
  # ══════════════════════════════════════════════
  /activity/{id}/test-case:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      operationId: testCaseList
      tags: [Test Case]
      summary: Listar casos de prueba
      responses:
        "200":
          description: Lista de casos de prueba
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: testCaseCreate
      tags: [Test Case]
      summary: Crear caso de prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "201":
          description: Caso de prueba creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/BadRequest"

  /activity/{id}/test-case/{testCaseId}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
      - $ref: "#/components/parameters/TestCaseId"
    put:
      operationId: testCaseUpdate
      tags: [Test Case]
      summary: Actualizar caso de prueba
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Caso de prueba actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: testCaseDelete
      tags: [Test Case]
      summary: Eliminar caso de prueba
      responses:
        "204":
          description: Caso de prueba eliminado
        "404":
          $ref: "#/components/responses/NotFound"

# ══════════════════════════════════════════════
#  Components
# ══════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT (4 horas de validez).

        Se obtiene mediante `POST /auth/login` y se refresca con `POST /auth/refresh`.

  parameters:
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID de la invitación
    LanguageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID del lenguaje de programación
    SubjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID de la materia
    ActivityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID de la actividad
    TestCaseId:
      name: testCaseId
      in: path
      required: true
      schema:
        type: integer
      description: ID del caso de prueba
    Skip:
      name: skip
      in: query
      schema:
        type: integer
        default: 0
      description: Registros a saltar (paginación)
    Take:
      name: take
      in: query
      schema:
        type: integer
        default: 10
      description: Registros por página
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Número de página
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
      description: Registros por página

  schemas:
    # ── Shared ──
    Error:
      title: Error
      description: Respuesta de error estándar
      type: object
      properties:
        error:
          type: string
          description: Mensaje descriptivo del error

    CodeFile:
      title: CodeFile
      description: Archivo de código fuente codificado en Base64
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          description: Nombre del archivo con extensión
          example: main.cpp
        content:
          type: string
          description: Contenido del archivo codificado en Base64
          example: I2luY2x1ZGUgPGlvc3RyZWFtPgppbnQgbWFpbigpIHsgcmV0dXJuIDA7IH0=

    # ── Auth ──
    RegisterUserRequest:
      title: RegisterUserRequest
      description: Datos para registrar un nuevo usuario
      type: object
      required: [email, password, name, lastName]
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: estudiante@uady.mx
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña (mínimo 8 caracteres)
          example: AdminPassword123!!
        name:
          type: string
          maxLength: 100
          description: Nombre del usuario
          example: Alan
        lastName:
          type: string
          maxLength: 100
          description: Apellido del usuario
          example: Turing
        invitationCode:
          type: string
          description: Código de invitación (requerido para Teacher)
          example: A1B2C3D4
        identifier:
          type: string
          description: Identificador único opcional (matrícula)
          example: "123456"

    RegisterUserResponse:
      title: RegisterUserResponse
      description: Datos del usuario registrado exitosamente
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único del usuario
        email:
          type: string
          description: Correo electrónico
        name:
          type: string
          description: Nombre del usuario
        lastName:
          type: string
          description: Apellido del usuario
        role:
          type: string
          description: Rol asignado al usuario
          example: Student

    LoginRequest:
      title: LoginRequest
      description: Credenciales para iniciar sesión
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email o identificador (matrícula)
          example: admin@admin.com
        password:
          type: string
          format: password
          description: Contraseña del usuario
          example: AdminPassword123!!

    LoginResponse:
      title: LoginResponse
      description: Tokens de autenticación JWT
      type: object
      properties:
        token:
          type: string
          description: Access token JWT (4 horas)
        refreshToken:
          type: string
          description: Refresh token JWT (7 días)

    RefreshSessionRequest:
      title: RefreshSessionRequest
      description: Solicitud para refrescar tokens
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token JWT válido

    # ── Execution ──
    RunCodeWithFilesRequest:
      title: RunCodeWithFilesRequest
      description: Solicitud para ejecutar código con múltiples archivos
      type: object
      required: [languageId, files, entryPoint]
      properties:
        languageId:
          type: integer
          description: ID del lenguaje de programación
          example: 1
        files:
          type: array
          description: Archivos de código a ejecutar
          items:
            $ref: "#/components/schemas/CodeFile"
        entryPoint:
          type: string
          description: Nombre del archivo principal a ejecutar
          example: main.cpp
        stdin:
          type: string
          description: Entrada estándar codificada en Base64 (opcional)
          example: NQo3

    ExecutionResult:
      title: ExecutionResult
      description: Resultado de la ejecución de código
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ExecutionStatus"
        stdout:
          type: string
          description: Salida estándar del programa
        stderr:
          type: string
          description: Salida de error (vacío si exitoso)
        timeMs:
          type: integer
          description: Tiempo de ejecución en milisegundos
          example: 342

    ExecutionStatus:
      title: ExecutionStatus
      description: Estado de la ejecución de código
      type: string
      enum: [SUCCESS, TIME_LIMIT_EXCEEDED, RUNTIME_ERROR, COMPILE_ERROR]

    # ── Evaluation ──
    EvaluationResult:
      title: EvaluationResult
      description: Resultado de la evaluación de una solución
      type: object
      properties:
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        finalGrade:
          type: number
          description: Calificación sobre 100 (0 si hubo error)
          example: 100
        passedTests:
          type: integer
          description: Número de casos de prueba pasados
          example: 3
        totalTests:
          type: integer
          description: Número total de casos de prueba
          example: 4
        executionTimeMs:
          type: integer
          description: Tiempo total de ejecución en milisegundos
          example: 1450
        compilerOutput:
          type: [string, "null"]
          description: Mensaje de error si hubo fallo de compilación
        languageId:
          type: integer
          description: ID del lenguaje de programación

    SubmissionStatus:
      title: SubmissionStatus
      description: Estado de la evaluación de una solución
      type: string
      enum:
        [PENDING, ACCEPTED, WRONG_ANSWER, TIME_LIMIT_EXCEEDED, COMPILE_ERROR, RUNTIME_ERROR]

    # ── Invitation ──
    Invitation:
      title: Invitation
      description: Código de invitación para registrar profesores
      type: object
      properties:
        id:
          type: integer
          description: ID único de la invitación
        code:
          type: string
          description: Código alfanumérico de 8 caracteres
          example: A1B2C3D4
        roleId:
          type: integer
          description: ID del rol asociado
        isUsed:
          type: boolean
          description: Indica si el código ya fue utilizado
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación
        role:
          type: object
          description: Rol asociado a la invitación
          properties:
            id:
              type: integer
            name:
              type: string

    PaginatedInvitations:
      title: PaginatedInvitations
      description: Lista paginada de códigos de invitación
      type: object
      properties:
        data:
          type: array
          description: Arreglo de invitaciones
          items:
            $ref: "#/components/schemas/Invitation"
        totalCount:
          type: integer
          description: Total de registros disponibles

    # ── Language ──
    CreateLanguageRequest:
      title: CreateLanguageRequest
      description: Datos para crear un lenguaje de programación
      type: object
      required: [name, editorIdentifier, version, dockerImage, executionCommand, fileExtension]
      properties:
        name:
          type: string
          description: Nombre del lenguaje
          example: C++
        editorIdentifier:
          type: string
          description: Identificador para el editor de código
          example: cpp
        version:
          type: string
          description: Versión del lenguaje
          example: "13.2"
        dockerImage:
          type: string
          description: Imagen Docker para ejecutar el código
          example: gcc:13.2
        executionCommand:
          type: string
          description: Comando de ejecución (usa ${file} como placeholder)
          example: g++ -o solution *.cpp && ./solution
        fileExtension:
          type: string
          description: Extensión de archivo del lenguaje
          example: cpp

    UpdateLanguageRequest:
      title: UpdateLanguageRequest
      description: Datos para actualizar un lenguaje de programación
      type: object
      properties:
        name:
          type: string
          description: Nombre del lenguaje
        editorIdentifier:
          type: string
          description: Identificador para el editor de código
        version:
          type: string
          description: Versión del lenguaje
        dockerImage:
          type: string
          description: Imagen Docker para ejecutar el código
        executionCommand:
          type: string
          description: Comando de ejecución
        fileExtension:
          type: string
          description: Extensión de archivo del lenguaje

    Language:
      title: Language
      description: Lenguaje de programación soportado
      type: object
      properties:
        id:
          type: integer
          description: ID único del lenguaje
        name:
          type: string
          description: Nombre del lenguaje
        editorIdentifier:
          type: string
          description: Identificador para el editor de código
        version:
          type: string
          description: Versión del lenguaje
        dockerImage:
          type: string
          description: Imagen Docker para ejecutar el código
        executionCommand:
          type: string
          description: Comando de ejecución
        fileExtension:
          type: string
          description: Extensión de archivo del lenguaje

    # ── User ──
    UserProfile:
      title: UserProfile
      description: Perfil completo del usuario
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único del usuario
        email:
          type: string
          description: Correo electrónico
        name:
          type: string
          description: Nombre del usuario
        lastName:
          type: string
          description: Apellido del usuario
        identifier:
          type: string
          description: Identificador único (matrícula)
        createdAt:
          type: string
          format: date-time
          description: Fecha de registro
        role:
          type: object
          description: Rol del usuario
          properties:
            id:
              type: integer
            name:
              type: string

    UpdateProfileRequest:
      title: UpdateProfileRequest
      description: Datos para actualizar el perfil del usuario
      type: object
      properties:
        name:
          type: string
          description: Nombre del usuario
        lastName:
          type: string
          description: Apellido del usuario
        identifier:
          type: string
          description: Identificador único (matrícula)

    ChangePasswordRequest:
      title: ChangePasswordRequest
      description: Solicitud para cambiar contraseña
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: Contraseña actual
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Nueva contraseña (mínimo 8 caracteres)

    # ── Subject ──
    CreateSubjectRequest:
      title: CreateSubjectRequest
      description: Datos para crear una materia
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Nombre de la materia
          example: Estructuras de Datos

    UpdateSubjectRequest:
      title: UpdateSubjectRequest
      description: Datos para actualizar una materia
      type: object
      properties:
        name:
          type: string
          description: Nombre de la materia

    Subject:
      title: Subject
      description: Materia o curso
      type: object
      properties:
        id:
          type: integer
          description: ID único de la materia
        userId:
          type: string
          format: uuid
          description: ID del profesor propietario
        name:
          type: string
          description: Nombre de la materia
        professor:
          type: object
          description: Datos del profesor
          properties:
            name:
              type: string
              description: Nombre del profesor
            lastName:
              type: string
              description: Apellido del profesor

    PaginatedSubjects:
      title: PaginatedSubjects
      description: Lista paginada de materias
      type: object
      properties:
        data:
          type: array
          description: Arreglo de materias
          items:
            $ref: "#/components/schemas/Subject"
        totalCount:
          type: integer
          description: Total de registros disponibles

    # ── Activity ──
    CreateActivityRequest:
      title: CreateActivityRequest
      description: Datos para crear una actividad de código
      type: object
      required: [subjectId, languageId, title]
      properties:
        subjectId:
          type: integer
          description: ID de la materia a la que pertenece
        languageId:
          type: integer
          description: ID del lenguaje de programación
        title:
          type: string
          maxLength: 200
          description: Título de la actividad
          example: Suma de dos números
        description:
          type: [string, "null"]
          description: Descripción detallada de la actividad
          example: Escribe un programa que lea dos enteros y devuelva su suma.
        starterCode:
          type: array
          items:
            $ref: "#/components/schemas/CodeFile"
          description: Archivos de código inicial para el estudiante
        maxAttempts:
          type: integer
          default: 0
          description: Límite de envíos (0 = ilimitado)
        allowCopy:
          type: boolean
          default: true
          description: Permitir copiar código
        allowPaste:
          type: boolean
          default: true
          description: Permitir pegar código

    UpdateActivityRequest:
      title: UpdateActivityRequest
      description: Datos para actualizar una actividad
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción detallada
        starterCode:
          type: array
          items:
            $ref: "#/components/schemas/CodeFile"
          description: Archivos de código inicial
        maxAttempts:
          type: integer
          description: Límite de envíos
        allowCopy:
          type: boolean
          description: Permitir copiar código
        allowPaste:
          type: boolean
          description: Permitir pegar código

    Activity:
      title: Activity
      description: Actividad de programación completa
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único de la actividad
        professorId:
          type: string
          format: uuid
          description: ID del profesor creador
        languageId:
          type: integer
          description: ID del lenguaje de programación
        subjectId:
          type: integer
          description: ID de la materia
        title:
          type: string
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción detallada
        starterCode:
          type: [array, "null"]
          description: Archivos de código inicial
          items:
            $ref: "#/components/schemas/CodeFile"
        maxAttempts:
          type: integer
          description: Límite de envíos (0 = ilimitado)
        allowCopy:
          type: boolean
          description: Permitir copiar código
        allowPaste:
          type: boolean
          description: Permitir pegar código
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación

    ActivitySummary:
      title: ActivitySummary
      description: Resumen de actividad para listados
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID único de la actividad
        professorId:
          type: string
          format: uuid
          description: ID del profesor creador
        languageId:
          type: integer
          description: ID del lenguaje de programación
        subjectId:
          type: integer
          description: ID de la materia
        title:
          type: string
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción resumida
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación

    PaginatedActivitySummaries:
      title: PaginatedActivitySummaries
      description: Lista paginada de resúmenes de actividades
      type: object
      properties:
        data:
          type: array
          description: Arreglo de resúmenes de actividades
          items:
            $ref: "#/components/schemas/ActivitySummary"
        totalCount:
          type: integer
          description: Total de registros disponibles

    # ── Test Case ──
    CreateTestCaseRequest:
      title: CreateTestCaseRequest
      description: Datos para crear un caso de prueba
      type: object
      required: [expectedOutput]
      properties:
        input:
          type: [string, "null"]
          description: Entrada codificada en Base64 (opcional)
        expectedOutput:
          type: string
          description: Salida esperada codificada en Base64
        isHidden:
          type: boolean
          default: false
          description: Si es true, el estudiante no ve input ni output esperado

    UpdateTestCaseRequest:
      title: UpdateTestCaseRequest
      description: Datos para actualizar un caso de prueba
      type: object
      properties:
        input:
          type: [string, "null"]
          description: Entrada codificada en Base64
        expectedOutput:
          type: string
          description: Salida esperada codificada en Base64
        isHidden:
          type: boolean
          description: Visibilidad del caso de prueba

    TestCase:
      title: TestCase
      description: Caso de prueba para evaluar soluciones
      type: object
      properties:
        id:
          type: integer
          description: ID único del caso de prueba
        activityId:
          type: string
          format: uuid
          description: ID de la actividad asociada
        input:
          type: [string, "null"]
          description: Entrada codificada en Base64
        expectedOutput:
          type: string
          description: Salida esperada codificada en Base64
        isHidden:
          type: boolean
          description: Si es true, el estudiante no ve este caso

    # ── Student Workspace ──
    StudentWorkspace:
      title: StudentWorkspace
      description: Workspace del estudiante con datos públicos de la actividad
      type: object
      properties:
        activityId:
          type: string
          format: uuid
          description: ID de la actividad
        title:
          type: string
          description: Título de la actividad
        description:
          type: [string, "null"]
          description: Descripción de la actividad
        language:
          type: object
          description: Lenguaje de programación
          properties:
            id:
              type: integer
              description: ID del lenguaje
            name:
              type: string
              description: Nombre del lenguaje
            fileExtension:
              type: string
              description: Extensión de archivo
        starterCode:
          type: [array, "null"]
          description: Archivos de código inicial
          items:
            $ref: "#/components/schemas/CodeFile"
        allowCopy:
          type: boolean
          description: Permitir copiar código
        allowPaste:
          type: boolean
          description: Permitir pegar código
        maxAttempts:
          type: integer
          description: Límite de envíos (0 = ilimitado)
        testCases:
          type: array
          description: Casos de prueba públicos
          items:
            $ref: "#/components/schemas/PublicTestCase"

    PublicTestCase:
      title: PublicTestCase
      description: Caso de prueba visible para el estudiante
      type: object
      properties:
        id:
          type: integer
          description: ID del caso de prueba
        isHidden:
          type: boolean
          description: Si es true, no muestra input ni output
        input:
          type: [string, "null"]
          description: Entrada (solo si isHidden es false)
        expectedOutput:
          type: string
          description: Salida esperada (solo si isHidden es false)

  responses:
    BadRequest:
      description: Parámetros inválidos o faltantes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token inválido, expirado o ausente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Rol sin permisos para esta acción
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit excedido (2 peticiones / 5 min)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              error:
                type: string
                example: "Has excedido el límite de ejecuciones. Por favor, espera cinco antes de volver a intentarlo."
    ServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
